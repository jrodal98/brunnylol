- alias: g
  url: https://www.google.com
  command: "{url}/search?q={query}"
  description: Search Google

- alias: ddg
  url: https://www.duckduckgo.com
  command: "{url}/?q={query}"
  description: Search DuckDuckGo

- alias: yt
  url: https://www.youtube.com
  command: "{url}/results?search_query={query}"
  description: Search YouTube

- alias: b
  url: https://www.bing.com
  command: "{url}/search?q={query}"
  description: Search Bing

- alias: w
  url: https://www.wikipedia.org
  command: "{url}/wiki/Special:Search/{query}"
  description: Search Wikipedia

- alias: aw
  url: https://wiki.archlinux.org
  command: "{url}/index.php?title=Special%3ASearch&search={query}"
  description: Search the Arch Wiki

- alias: def
  url: https://www.dictionary.com
  command: "{url}/browse/{query}?s=t"
  description: Define a word with Dictionary.com

- alias: wut
  url: https://www.urbandictionary.com
  command: "{url}/define.php?term={query}"
  description: Search for a phrase on Urban Dictionary

- alias: am
  url: https://amazon.com
  command: "{url}/s?k={query}&ref=nb_sb_noss_2"
  description: Search Amazon

- alias: fb
  url: https://www.facebook.com
  command: "{url}/search/top?q={query}"
  description: Search Facebook

- alias: ig
  url: https://www.instagram.com
  command: "{url}/{query}/"
  description: Search Instagram

- alias: li
  url: https://www.linkedin.com
  command: "{url}/search/results/all/?keywords={query}&origin=GLOBAL_SEARCH_HEADER"
  description: Search LinkedIn

- alias: img
  url: https://images.google.com
  command: "{url}/images?um=1&hl=en&safe=active&nfpr=1&q={query}"
  description: Search Google Images

- alias: dbl
  url: http://localhost:8000/
  command: "{url}search?q={query}"
  description: Forward the query to your local version of Brunnylol (port 8000)

- alias: eb
  url: https://www.ebay.com
  command: "{url}/sch/i.html?_from=R40&_trksid=p2380057.m570.l1313&_nkw={query}&_sacat=0"
  description: Search eBay

- alias: maps
  url: https://www.google.com/maps
  command: "{url}/search/{query}"
  description: Search Google Maps

- alias: so
  url: https://stackoverflow.com
  command: "{url}/search?q={query}"
  description: Search questions on Stack Overflow

- alias: help
  url: /help
  description: Go to Brunnylol's help page

- alias: bl
  url: /
  command: /search?q={query}
  description: Brunnylol search

- alias: gh
  url: https://github.com
  command: "{url}/{query|!encode}"
  description: Go to a GitHub repo

- alias: pr
  url: https://proton.me
  command: "https://{product|map[m:mail,cal:calendar,dr:drive]|options[mail,drive,sheets,docs,vpn,calendar,pass,wallet,authenticator,meet,lumo][strict]}.proton.me/{subproduct?|map[p:photos,d:docs,s:sheets]|options[photos,docs,sheets][strict]}"
  description: "Proton services (shortcuts: m=mail, cal=calendar, dr=drive, p=photos, d=docs, s=sheets)"

