<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Brunnylol favicon: the search lens IS the bunny's head.
       Brand gradient and violet taken from static/css/main.css
       (--gradient-start #667eea, --gradient-end #764ba2). -->
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667eea"/>
      <stop offset="1" stop-color="#764ba2"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#grad)"/>
  <!-- magnifier handle, drawn first so it emerges from behind the head -->
  <line x1="38" y1="42" x2="54" y2="58" stroke="#ffffff" stroke-width="7" stroke-linecap="round"/>
  <!-- ears -->
  <ellipse cx="22" cy="11.5" rx="3.8" ry="8" fill="#ffffff" transform="rotate(-9 22 11.5)"/>
  <ellipse cx="35" cy="11.5" rx="3.8" ry="8" fill="#ffffff" transform="rotate(9 35 11.5)"/>
  <!-- head (the lens) -->
  <circle cx="28.5" cy="32.5" r="15.5" fill="#ffffff"/>
  <!-- face -->
  <circle cx="23.5" cy="31" r="1.8" fill="#764ba2"/>
  <circle cx="33.5" cy="31" r="1.8" fill="#764ba2"/>
  <path d="M25.9 34.9 L31.1 34.9 L28.5 38.1 Z" fill="#764ba2" stroke="#764ba2" stroke-width="1.4" stroke-linejoin="round"/>
  <path d="M28.5 38.2 Q28.5 40.6 26.0 40.8 M28.5 38.2 Q28.5 40.6 31.0 40.8" fill="none" stroke="#764ba2" stroke-width="1.3" stroke-linecap="round"/>
</svg>
