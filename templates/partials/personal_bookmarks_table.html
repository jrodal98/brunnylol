<table id="personal-bookmarks-table" hx-swap-oob="true">
            <thead>
                <tr>
                    <th class="sortable-th" data-sort-key="alias" title="Sort by alias" style="cursor: pointer;">Alias ↕</th>
                    <th>Type</th>
                    <th>URL/Template</th>
                    <th>Description</th>
                    <th class="sortable-th" data-sort-key="uses" title="Sort by uses" style="cursor: pointer;">Uses ↕</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="personal-bookmarks-body">
                {% for bookmark in personal_bookmarks %}
                {% include "partials/bookmark_row.html" %}
                {% endfor %}
                <tr id="personal-filter-empty" style="display: none;">
                    <td colspan="6" style="color: var(--text-secondary);">No bookmarks match your filter.</td>
                </tr>
            </tbody>
        </table>
