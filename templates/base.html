<!doctype html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>Brunnylol</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
    <link rel="search" type="application/opensearchdescription+xml" title="Brunnylol" href="/opensearch.xml">
    <link rel="manifest" href="/static/manifest.json">
  </head>
  <body>
    {% block nav %}
    <nav>
      <div>
        <a href="/about">About</a>
        <a href="/help">Help</a>
      </div>
      <div>
        <a href="/login">Login</a>
        {% if registration_open %}<a href="/register">Register</a>{% endif %}
      </div>
    </nav>
    {% endblock %} {% block content %}{% endblock %}
    <div id="confirm-modal" class="modal-backdrop" hidden>
      <div class="modal-card" role="alertdialog" aria-modal="true" aria-describedby="confirm-modal-message">
        <p id="confirm-modal-message"></p>
        <div class="modal-actions">
          <button type="button" id="confirm-modal-cancel" class="btn btn-secondary">Cancel</button>
          <button type="button" id="confirm-modal-ok" class="btn btn-danger">Confirm</button>
        </div>
      </div>
    </div>
    <script src="/static/js/confirm.js"></script>
  </body>
  <div class="footer">
    <p>Jacob Rodal © 2020</p>
  </div>
</html>
