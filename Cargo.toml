[package]
name = "brunnylol"
version = "0.2.0"
authors = ["Jacob Rodal <jrodal98@gmail.com>"]
edition = "2021"
rust-version = "1.81"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
askama = "0.15.1"
askama_axum = "0.4"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
bcrypt = "0.16"
chrono = { version = "0.4", features = ["serde"] }
clap = "4.5.54"
# HTTP client for URL imports and OpenAI-compatible AI calls.
# rustls (not native-tls) keeps the Docker image free of OpenSSL.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "cookies", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.16"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-native-tls", "sqlite", "chrono", "uuid"] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs", "trace", "limit"] }
tower_governor = "0.8"
url = "2.5"
urlencoding = "2.1"
uuid = { version = "1.19", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
